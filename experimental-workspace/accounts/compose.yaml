name: linear-algebra-accounts
services:
  secrets-init:
    image: linear-algebra-account-secrets
    build:
      context: ../..
      dockerfile: experimental-workspace/accounts/Secrets.Dockerfile
    volumes: [secrets:/secrets]
    network_mode: none
  database:
    image: linear-algebra-account-database
    build:
      context: ../..
      dockerfile: experimental-workspace/accounts/Database.Dockerfile
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /secrets/database-password
    volumes:
      - database:/var/lib/postgresql/data
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
        volume:
          subpath: database
    networks: [private]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, accounts]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 384m
  auth:
    image: linear-algebra-account-auth
    build:
      context: ../..
      dockerfile: experimental-workspace/accounts/Auth.Dockerfile
    user: "1000:1000"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:3105
      GOTRUE_SITE_URL: http://localhost:3105
      GOTRUE_URI_ALLOW_LIST: http://localhost:3105
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_JWT_ISSUER: http://localhost:3105/auth
    volumes:
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
        volume:
          subpath: auth
    networks: [private]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 3s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
  migrate:
    profiles: [tools]
    image: linear-algebra-account-migrations
    build:
      context: ../..
      dockerfile: experimental-workspace/accounts/Migration.Dockerfile
    environment:
      PGHOST: database
    volumes:
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
        volume:
          subpath: migration
    networks: [private]
    depends_on:
      auth:
        condition: service_healthy

  backend:
    profiles: [practice]
    image: linear-algebra-account-backend
    build:
      context: ../..
      dockerfile: experimental-workspace/accounts/Tools.Dockerfile
    command: [node, server.mjs]
    user: "1000:1000"
    init: true
    environment:
      APP_ORIGIN: http://localhost:3100
      RENDERER_URL: http://linear-algebra-experimental-renderer-1:3000
      EXERCISE_SESSION_DIR: /private/unused
    volumes:
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
        volume:
          subpath: backend
      - legacy-sessions:/legacy:ro
    networks: [private, practice]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 384m
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  practice:
    external: true
    name: linear-algebra-experimental_default
  private:
    internal: true
volumes:
  database: {}
  secrets: {}
  legacy-sessions:
    external: true
    name: linear-algebra-experimental_sessions
