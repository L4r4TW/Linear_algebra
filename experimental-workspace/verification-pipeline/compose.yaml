name: linear-algebra-verification
services:
  tools:
    image: linear-algebra-verification
    build:
      context: ../..
      dockerfile: experimental-workspace/verification-pipeline/Dockerfile
    environment: &database
      PGHOST: linear-algebra-opl-catalog-database-1
      PGUSER: postgres
      PGDATABASE: opl_catalog
    networks: [catalog]
    volumes:
      - type: volume
        source: opl
        target: /opl
        read_only: true
  renderer:
    image: linear-algebra-verification-renderer
    build:
      context: ../..
      dockerfile: experimental-workspace/verification-pipeline/Renderer.Dockerfile
    init: true
    command: [/bin/sh, -c, "rm -f /usr/app/script/hypnotoad.pid && exec hypnotoad -f ./script/render_app"]
    environment:
      MOJO_MODE: development
      SITE_HOST: http://renderer:3000
    networks: [private]
    cpus: 1
    mem_limit: 1500m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    volumes:
      - type: volume
        source: opl
        target: /usr/app/webwork-open-problem-library
        read_only: true
        volume:
          nocopy: true
          subpath: webwork-open-problem-library
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://localhost:3000/health"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
  worker:
    image: linear-algebra-verification
    init: true
    command: [worker, --loop]
    environment:
      <<: *database
      RENDERER_URL: http://renderer:3000
    networks: [catalog, private]
    cpus: 1.5
    mem_limit: 1800m
    shm_size: 512m
    pids_limit: 300
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,size=768m"]
    volumes:
      - type: volume
        source: opl
        target: /opl
        read_only: true
    depends_on:
      renderer:
        condition: service_healthy
  preview1234: &preview
    image: linear-algebra-verification
    init: true
    entrypoint: [node, pipeline/preview.mjs]
    environment:
      <<: *database
      PREVIEW_SEED: 1234
      PREVIEW_ORIGIN: http://localhost:3103
      RENDERER_URL: http://renderer:3000
    networks: [catalog, private, console]
    ports: ["127.0.0.1:3103:3003"]
    mem_limit: 768m
    tmpfs: ["/tmp:rw,size=128m"]
    volumes: [operator:/secrets]
    depends_on:
      renderer:
        condition: service_healthy
  preview4321:
    <<: *preview
    environment:
      <<: *database
      PREVIEW_SEED: 4321
      PREVIEW_ORIGIN: http://localhost:3104
      RENDERER_URL: http://renderer:3000
    ports: ["127.0.0.1:3104:3003"]
  operator:
    image: linear-algebra-verification
    init: true
    entrypoint: [node, pipeline/server.mjs]
    environment:
      <<: *database
      OPERATOR_ORIGIN: http://localhost:3102
      RENDERER_URL: http://renderer:3000
    networks: [catalog, private, console]
    ports: ["127.0.0.1:3102:3002"]
    mem_limit: 1024m
    shm_size: 256m
    pids_limit: 300
    tmpfs: ["/tmp:rw,size=384m"]
    volumes: [operator:/secrets]
    depends_on:
      renderer:
        condition: service_healthy
networks:
  console: {}
  private:
    internal: true
  catalog:
    external: true
    name: linear-algebra-opl-catalog_catalog
volumes:
  operator:
  opl:
    external: true
    name: linear-algebra-experimental_opl
